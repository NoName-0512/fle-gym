[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fle-gym"
version = "1.0.0rc5"
description = "Gymnasium-compatible wrapper for the Factorio Learning Environment"
readme = "README.md"
license = "LicenseRef-FLE-Gym-NonCommercial-1.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.28,<2",
    "numpy>=1.23,<3",
    "factorio-learning-environment==0.4.3",
    "a2a-sdk==0.3.25",
]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fle_gym*"]
namespaces = true

[tool.setuptools.package-data]
fle_gym = ["**/*.json", "**/*.lua", "**/*.txt", "**/*.toml", "**/*.yaml", "**/*.yml", "**/*.cfg", "**/*.ini", "**/*.csv", "**/*.dat", "**/*.bin", "**/*.npz", "**/*.npy"]
