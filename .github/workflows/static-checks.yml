name: Static package checks
on:
  push:
  pull_request:
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile Python modules
        run: python -m compileall -q fle_gym tests
      - name: Run tests that require no running Factorio server
        run: python -m unittest discover -s tests -v
      - name: Build source package and wheel (no dependency installation)
        run: |
          python -m pip install --upgrade setuptools wheel
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir /tmp/fle_gym_wheel
